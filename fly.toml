app = "toronto-events-api"
primary_region = "yyz"

[build]
  dockerfile = "Dockerfile"

[processes]
  web = "gunicorn events.wsgi:application --bind 0.0.0.0:8080 --workers 4 --timeout 120"
  worker = "celery -A events worker --loglevel=info"
  beat = "celery -A events beat --loglevel=info"

[env]
  PORT = "8080"
  DEBUG = "False"
  ENVIRONMENT = "production"

[[services]]
  protocol = "tcp"
  internal_port = 8080
  processes = ["web"]

  [[services.ports]]
    port = 80
    handlers = ["http"]
    force_https = true

  [[services.ports]]
    port = 443
    handlers = ["tls", "http"]
  
  [services.concurrency]
    type = "connections"
    hard_limit = 25
    soft_limit = 20

  [[services.tcp_checks]]
    interval = "15s"
    timeout = "2s"
    grace_period = "1s"
