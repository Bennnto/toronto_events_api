[build]
builder = "nixpacks"
buildCommand = "pip install -r requirements.txt && python manage.py collectstatic --noinput"

[deploy]
startCommand = "python manage.py migrate --noinput && celery -A events worker --beat --schedule=/tmp/celerybeat-schedule --loglevel=info --concurrency=2 & gunicorn events.wsgi:application --bind 0.0.0.0:$PORT --workers 4 --timeout 120"
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3
